name: CI Pipeline - Task Automation Robot

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    name: Build and Test (Backend + Frontend)
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # 3️⃣ Installer dépendances du backend
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # 4️⃣ Tester le backend (si tests)
      - name: Run backend tests
        working-directory: ./backend
        run: npm test || echo "No tests configured"

      # 5️⃣ Installer dépendances du frontend
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # 6️⃣ Build du frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build -- --configuration production

      # 7️⃣ Tester le frontend (optionnel)
      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless || echo "Tests skipped"

  run-robot-tests:
    name: Run Robot Framework Tests
    runs-on: ubuntu-latest
    needs: build-and-test  # exécute après le build

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Installer Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Installer Robot Framework et bibliothèques nécessaires
      - name: Install Robot Framework and Libraries
        run: |
          pip install robotframework
          pip install robotframework-jsonlibrary

      # 4️⃣ Exécuter les tests Robot
      - name: Run Robot tests
        run: robot robot/runner.robot

      # 5️⃣ Sauvegarder les rapports comme artefacts GitHub
      - name: Upload Robot Reports
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-reports
          path: |
            robot/log.html
            robot/report.html
            robot/output.xml
